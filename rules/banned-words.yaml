# T04 企微提炼，2026-11-01。具体时间与冲突见 data/wecom/risk-words.md。
- word: API
  level: ban
  platform: [xhs, xianyu]
  replace: 模型服务
  reason: 运营反馈小红书和闲鱼都不可写（2026-10-30）

- word: 量大管饱
  level: ban
  platform: [xhs]
  replace: 便宜量大
  reason: 运营较晚反馈明确禁用，覆盖历史素材用法（2026-10-30 18:55）

- word: 询价
  level: ban
  platform: [xhs]
  replace: 直接安排上
  reason: 运营明确说询价小红书不能写（2026-10-30）

- word: '[一二三四五六七八九十零〇两半]+(?:点[一二三四五六七八九十零〇]+)?\s*折'
  regex: true
  level: ban
  platform: [xhs]
  replace: 活动价
  reason: 图片和文案的具体折扣均不可写，补足中文数字（2026-10-28）

- word: 满血
  level: ban
  platform: [xhs]
  models: [seedance]
  replace: ""
  reason: Seedance 单独禁词，删除相关承诺后重写（2026-10-29）

- word: 管饱管够
  level: ban
  platform: [xhs]
  models: [seedance]
  replace: 活动价
  reason: Seedance 单独禁词（2026-10-29）

- word: 不卡人脸
  level: ban
  platform: [xhs]
  models: [seedance]
  replace: ""
  reason: Seedance 单独禁词，不换成等义的人脸能力保证（2026-10-29）

- word: 秒级
  level: ban
  platform: [xhs]
  models: [seedance]
  replace: ""
  reason: Seedance 单独禁词，不换成秒出等速度承诺（2026-10-29）

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>Hanabi·内容工作台</title><link rel="icon" href="/assets/hanabi-avatar.png"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/lib/content-ops-references.css"><link rel="stylesheet" href="/lib/content-ops-editors.css"><script type="module" src="/lib/content-ops-editors.mjs"></script><script type="module" src="/app.js"></script></head>
<body><div class="app-shell" id="app-shell"><aside class="left-rail" aria-label="主导航"><div class="rail-brand-row"><button class="hanabi-brand" data-view="generate"><img class="hanabi-mark" src="/assets/hanabi-avatar.png" alt=""><span><strong>Hanabi</strong><small>内容工作台</small></span></button></div><nav class="main-nav" aria-label="功能导航"><button class="nav-link" data-view="generate">生成图文</button><button class="nav-link" data-view="references">素材库</button><button class="nav-link" data-view="persona">思敏偏好</button><button class="nav-link" data-view="banned">风险词</button><button class="nav-link" data-view="preview">预览</button></nav><div class="ops-batch-history"><label for="content-ops-history">历史批次</label><select id="content-ops-history"><option value="">选择历史批次</option></select></div></aside><main class="main-column"><div class="main-content">
<section class="view-panel" id="view-generate" data-title="生成图文"><h1>生成图文</h1><p id="content-ops-provider" class="ops-provider-hint">正在读取配置…</p><form id="content-ops-form" class="ops-peizhi-form"><label>模型名<input id="content-ops-model" name="model" value="GLM5.3" maxlength="80" required></label><label>数量<input id="content-ops-count" name="count" type="number" min="1" max="10" value="2" required></label><label>平台<select id="content-ops-platform" name="platform"><option value="xhs">小红书</option></select></label><label>封面背景<select id="content-ops-background" name="backgroundMode"><option value="cached">复用已有背景</option><option value="fresh">生成新背景</option></select></label><button id="content-ops-submit" class="button" type="submit">开始生成</button><button id="content-ops-stop" class="button button-outline" type="button" hidden>停止</button><button id="content-ops-new" class="text-button" type="button" hidden>另做一批</button><p id="content-ops-status" class="ops-status" role="status"></p></form><div id="content-ops-results"></div></section>
<section class="view-panel" id="view-references" data-title="素材库"><h1>全量素材库</h1><div id="content-ops-references"><div class="ref-toolbar"><label>平台<select id="content-ops-ref-platform"><option value="xhs">小红书</option><option value="xianyu">闲鱼</option></select></label><label>排序<select id="content-ops-ref-sort"><option value="best">精选优先</option><option value="engaged">互动最高</option><option value="newest">最新</option><option value="wanted">最想要</option></select></label><span id="content-ops-ref-total"></span><span id="content-ops-ref-progress" class="ref-progress"></span><span id="content-ops-ref-selection" class="ref-selection"></span><button id="content-ops-ref-clear" class="ref-button" type="button" hidden>清空待引用</button></div><p id="content-ops-ref-status" class="ref-status" role="status"></p><div id="content-ops-ref-pinned" class="ref-grid" hidden></div><div id="content-ops-ref-grid" class="ref-grid"></div><button id="content-ops-ref-more" class="ref-button" type="button" hidden>加载更多</button></div></section>
<section class="view-panel" id="view-persona" data-title="思敏偏好"><h1>思敏偏好</h1><div class="content-ops-editors"><details id="content-ops-persona" open><summary>偏好规则 <span id="persona-version"></span></summary><p id="persona-status" class="editor-status" role="status"></p><section class="editor-section"><h2>判断标准 <button id="persona-add-standard" type="button">添加</button></h2><ol id="persona-standards" class="editor-list"></ol><form id="persona-form-standard" class="editor-form" hidden><textarea name="text" required></textarea><input name="evidence" placeholder="证据编号"><button type="submit">保存</button><button type="button" data-editor-cancel>取消</button></form></section><section class="editor-section"><h2>反例 <button id="persona-add-anti" type="button">添加</button></h2><ol id="persona-anti" class="editor-list"></ol><form id="persona-form-anti" class="editor-form" hidden><textarea name="text" required></textarea><input name="evidence" placeholder="证据编号"><button type="submit">保存</button><button type="button" data-editor-cancel>取消</button></form></section><section class="editor-section"><h2>工作反馈摘录 <button id="persona-add-quote" type="button">添加</button></h2><div id="persona-quotes" class="editor-quotes"></div><form id="persona-form-quote" class="editor-form" hidden><textarea name="text" required></textarea><input name="date" type="date"><label><input name="redacted" type="checkbox" required> 已去敏</label><button type="submit">保存</button><button type="button" data-editor-cancel>取消</button></form></section><details><summary>原始偏好文档</summary><pre id="persona-raw"></pre></details></details></div></section>
<section class="view-panel" id="view-banned" data-title="风险词"><h1>风险词</h1><div class="content-ops-editors"><details id="content-ops-banned-words" open><summary>风险词规则 <span id="banned-count"></span></summary><p id="banned-status" class="editor-status" role="status"></p><div class="editor-table-scroll"><table id="banned-words-table"><thead><tr><th>词或规则</th><th>级别</th><th>平台</th><th>模型范围</th><th>替换建议</th><th>原因</th><th>操作</th></tr></thead><tbody></tbody></table></div><details class="editor-add-details"><summary>添加风险词</summary><form id="banned-add-form" class="editor-form"><label>风险词<input name="word" maxlength="240" required></label><label>级别<select name="level"><option value="ban">ban</option><option value="warn">warn</option></select></label><fieldset><legend>平台</legend><label><input name="platform" type="checkbox" value="xhs" checked>小红书</label><label><input name="platform" type="checkbox" value="xianyu">闲鱼</label><label><input name="platform" type="checkbox" value="gzh">公众号</label></fieldset><label>模型范围<input name="model_scope" maxlength="160"></label><label>替换建议<input name="replace" maxlength="240"></label><label>原因<textarea name="reason" rows="2" maxlength="1000" required></textarea></label><button type="submit">添加</button></form></details><details><summary>原始风险词文件</summary><pre id="banned-raw"></pre></details></details></div></section>
<section class="view-panel" id="view-preview" data-title="预览"><h1>预览</h1><p>生成结果会在这里展示，点击结果中的预览进入。</p><div id="preview-content"></div></section>
</div></main></div></body></html>

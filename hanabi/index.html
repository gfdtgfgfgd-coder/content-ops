<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <meta name="application-name" content="Hanabi·内容工作台">
    <title>Hanabi·内容工作台</title>
    <link rel="icon" type="image/png" href="/assets/hanabi-avatar.png">
    <link rel="stylesheet" href="/node_modules/@radix-ui/colors/mauve.css">
    <link rel="stylesheet" href="/node_modules/@radix-ui/colors/mauve-dark.css">
    <link rel="stylesheet" href="/node_modules/@radix-ui/colors/pink.css">
    <link rel="stylesheet" href="/node_modules/@radix-ui/colors/pink-dark.css">
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/noto-sans-sc/index.css">
    <link rel="stylesheet" href="/styles.css?v=hanabi-content-ops-20261103">
    <link rel="stylesheet" href="/lib/workbench-skin.css?v=hanabi-native-20261028">
    <link rel="stylesheet" href="/lib/preview-batch.css?v=hanabi-batch-20261029">
    <link rel="stylesheet" href="/lib/content-ops-references.css?v=20261102">
    <script src="/lib/ops-nav.mjs?v=1" defer></script>
    <script type="module" src="/lib/content-ops-references.mjs"></script>
    <script type="module" src="/lib/content-ops-ui.mjs"></script>
    <script type="module" src="/app.js?v=hanabi-content-ops-20261103"></script>
  </head>
  <body>
    <div class="app-shell" id="app-shell">

      <!-- 左侧导航 -->
      <aside class="left-rail" id="main-navigation-rail" aria-label="主导航">
        <div class="rail-brand-row">
          <button class="hanabi-brand" type="button" data-view="caihuo" aria-label="Hanabi 内容工作台">
            <img class="hanabi-mark" src="/assets/hanabi-avatar.png" alt="" aria-hidden="true">
            <span><strong>Hanabi</strong><small>内容工作台</small></span>
          </button>
          <button id="rail-toggle" type="button" class="shell-icon-button" aria-label="收起侧栏" aria-expanded="true" aria-controls="main-navigation-rail" title="收起侧栏">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m6-10-2 2 2 2"/></svg>
          </button>
        </div>

        <nav class="main-nav workflow-nav" aria-label="内容生产流程">
          <section class="nav-stage-group nav-stage-inflow" aria-label="采火">
            <button class="nav-link flow-nav-link" data-view="caihuo" title="采火 · 参考帖">
              <span class="nav-glyph"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5v14c3.5-1 6.5-1 9 .5 2.5-1.5 5.5-1.5 9-.5V5c-3.5-1-6.5-1-9 .5C9.5 4 6.5 4 3 5Zm9 .5v14"/></svg></span>
              <span class="nav-label"><strong>采火</strong><small>参考帖</small></span>
            </button>
          </section>
          <section class="nav-stage-group nav-stage-refine" aria-label="调配">
            <button class="nav-link flow-nav-link" data-view="peizhi" title="调配 · 生成参数">
              <span class="nav-glyph"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3m-3.5-6.5-2 2m-9 9-2 2m0-14 2 2m9 9 2 2"/></svg></span>
              <span class="nav-label"><strong>调配</strong><small>生成参数</small></span>
            </button>
          </section>
          <section class="nav-stage-group nav-stage-outflow" aria-label="制花">
            <button class="nav-link flow-nav-link" data-view="zhihua" title="制花 · 生成结果">
              <span class="nav-glyph"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c0 0-4 4-4 9s4 9 4 9 4-4 4-9-4-9-4-9z"/><path d="M3 12h18M5.5 6.5c2 2 4 4 6.5 5.5m9-5.5c-2 2-4 4-6.5 5.5"/></svg></span>
              <span class="nav-label"><strong>制花</strong><small>生成结果</small></span>
            </button>
          </section>
        </nav>

        <!-- 历史批次 -->
        <div class="ops-batch-history">
          <div class="ops-batch-history-heading"><span>历史批次</span></div>
          <select id="content-ops-history" class="ops-batch-select"><option value="">选择历史批次</option></select>
        </div>

        <button id="connections-open" type="button" class="connection-launch" title="模型接入">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7V3m6 4V3M7 7h10v4a5 5 0 0 1-10 0zm5 9v5"/></svg>
          <span>接入<small id="connection-summary">尚未接入</small></span>
          <i id="connection-dot" aria-hidden="true"></i>
          <svg class="ui-icon connection-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </aside>

      <div class="rail-resizer" id="rail-resizer" role="separator" aria-orientation="vertical" aria-label="调整左侧导航宽度" aria-valuemin="205" aria-valuemax="420" aria-valuenow="220" tabindex="0"></div>

      <main class="main-column">
        <div class="main-content">

          <!-- 采火：参考帖 -->
          <section class="view-panel" id="view-caihuo" data-title="采火 · 参考帖">
            <div class="ops-ref-page">
              <header class="ops-ref-page-header">
                <h1>采火 · 素材库</h1>
                <p>图文、封面文字与互动数放在一起，随时对照参考。</p>
              </header>
              <details id="content-ops-references" open>
                <summary>全量素材 <span id="content-ops-ref-total">正在读取</span></summary>
                <div class="ref-toolbar">
                  <label for="content-ops-ref-platform">平台
                    <select id="content-ops-ref-platform"><option value="xhs">小红书</option><option value="xianyu">闲鱼</option></select>
                  </label>
                  <label for="content-ops-ref-sort">排序
                    <select id="content-ops-ref-sort"><option value="best">精选优先</option><option value="engaged">互动最高</option><option value="newest">最新</option><option value="wanted" hidden disabled>最想要</option></select>
                  </label>
                  <span id="content-ops-ref-progress" class="ref-progress"></span>
                  <span id="content-ops-ref-selection" class="ref-selection" aria-live="polite"></span>
                  <button id="content-ops-ref-clear" type="button" class="ref-text-button" hidden>清空待引用</button>
                </div>
                <p id="content-ops-ref-status" class="ref-status" role="status" aria-live="polite"></p>
                <div id="content-ops-ref-pinned" class="ref-grid" aria-label="定位的参考帖" hidden></div>
                <div id="content-ops-ref-grid" class="ref-grid" aria-label="素材列表"></div>
                <div class="ref-pagination"><button id="content-ops-ref-more" type="button" class="ref-button" hidden>加载更多</button></div>
              </details>
            </div>
          </section>

          <!-- 调配：生成参数 -->
          <section class="view-panel" id="view-peizhi" data-title="调配 · 生成参数">
            <div class="ops-peizhi-page">
              <div class="ops-peizhi-header">
                <h1>调配</h1>
                <p id="content-ops-provider" class="ops-provider-hint">文案 Claude · 图 Qwen</p>
              </div>
              <form id="content-ops-form" class="ops-peizhi-form">
                <div class="ops-task-input-wrap">
                  <label class="ops-task-label" for="simin-task-input">任务描述</label>
                  <div class="ops-task-input-inner">
                    <textarea id="simin-task-input" rows="2" placeholder="今天做两张 GLM5.3 的小红书图文帖子" aria-label="任务描述"></textarea>
                    <button class="ops-parse-btn" id="ops-parse-btn" type="button" title="自动解析模型名和数量">解析</button>
                  </div>
                </div>
                <div class="ops-params-grid">
                  <label class="ops-param">
                    <span>模型名</span>
                    <input id="content-ops-model" name="model" value="GLM5.3" maxlength="80" required placeholder="GLM5.3">
                  </label>
                  <label class="ops-param ops-param--narrow">
                    <span>数量</span>
                    <input id="content-ops-count" name="count" type="number" min="1" max="10" value="2" required>
                  </label>
                  <label class="ops-param">
                    <span>平台</span>
                    <select id="content-ops-platform" name="platform">
                      <option value="xhs">小红书</option>
                      <option value="xianyu">闲鱼</option>
                    </select>
                  </label>
                  <label class="ops-param">
                    <span>封面背景</span>
                    <select id="content-ops-background" name="backgroundMode">
                      <option value="cached">复用已有背景</option>
                      <option value="fresh">生成新背景</option>
                    </select>
                  </label>
                </div>
                <div class="ops-peizhi-actions">
                  <button class="button" id="content-ops-submit" type="submit">开始制花</button>
                  <button class="button button-outline" id="content-ops-stop" type="button" hidden>停止</button>
                  <button class="text-button" id="content-ops-new" type="button" hidden>另做一批</button>
                  <p id="content-ops-status" role="status" aria-live="polite" class="ops-status"></p>
                </div>
              </form>
            </div>
          </section>

          <!-- 制花：生成结果 -->
          <section class="view-panel" id="view-zhihua" data-title="制花 · 生成结果">
            <div class="ops-zhihua-page">
              <div class="ops-zhihua-header">
                <h1>制花</h1>
                <p>生成完成后图文在这里，发布前核对事实和图片。</p>
              </div>
              <div id="content-ops-results"></div>
            </div>
          </section>

        </div>
      </main>
    </div>

    <!-- 模型接入弹窗（保留功能） -->
    <dialog id="connections-dialog" class="connections-dialog" aria-labelledby="connections-title">
      <header><div><span class="eyebrow">HANABI</span><h2 id="connections-title">接入</h2><p>管理模型连接。</p></div><button class="icon-button" type="button" data-connection-action="close" aria-label="关闭接入">×</button></header>
      <h3>API 接入</h3><div id="connection-api-list"></div>
      <details id="connection-api-details" class="connection-api-details"><summary>＋ 添加 API</summary><form id="connection-api-form"><input type="hidden" name="id"><label>名称<input name="name" placeholder="例如：公司网关" required></label><label>协议<select name="provider"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option><option value="google">Google Gemini</option></select></label><label class="full">API 地址<input name="endpoint" placeholder="https://api.example.com/v1" type="url" required></label><label class="full">API Key<input name="key" type="password" autocomplete="new-password" placeholder="仅保存在本机，修改时留空可保留原 Key"></label><label class="full">模型 ID<input name="models" placeholder="多个模型用逗号分隔" required></label><button type="button" class="button button-primary" data-connection-action="save">保存并测试</button></form><p id="connection-model-catalog" class="connection-model-catalog"></p></details>
      <h3>订阅登录</h3><div id="connection-accounts"></div>
      <section id="connection-login" class="connection-login" hidden><strong id="connection-login-state"></strong><a id="connection-login-link" class="button button-outline" target="_blank" rel="noreferrer" hidden>打开官方登录</a><pre id="connection-login-output" tabindex="0"></pre><div class="connection-login-controls"><button type="button" data-connection-action="key" data-key="up" aria-label="上一项">↑</button><button type="button" data-connection-action="key" data-key="down" aria-label="下一项">↓</button><button type="button" data-connection-action="key" data-key="enter">确认</button><input id="connection-login-input" aria-label="官方登录授权码或输入" autocomplete="off" placeholder="需要时粘贴授权码"><button type="button" data-connection-action="input">提交</button></div></section>
      <p id="connection-notice" class="connection-notice" role="status"></p>
    </dialog>

    <!-- 保留 DOM 供 JS 引用，不显示 -->
    <div hidden aria-hidden="true">
      <div id="chat-session-list"></div>
      <div id="chat-transcript"></div>
      <input id="chat-input" type="text">
      <select id="chat-model"></select>
      <div id="collection-grid"></div>
      <div id="analysis-job-list"></div>
      <select id="analysis-model" data-ai-model-select></select>
      <div id="batch-preview-workbench"></div>
      <div id="task-reference-list"></div>
      <div id="collection-modules"></div>
      <span id="collection-count"></span>
      <input id="collection-search" type="search">
      <select id="archive-platform-filter"></select>
      <select id="archive-topic-filter"></select>
      <div id="archive-media-filters"></div>
      <div id="market-discovery-list"></div>
      <div id="inflow-sample-list"></div>
      <select id="inflow-file-grouping"></select>
      <div id="inflow-intent-list"></div>
      <div id="inflow-dropzone"></div>
      <input id="inflow-files" type="file" multiple>
      <input id="chat-files" type="file" multiple>
      <input id="chat-add-file" type="button">
      <div id="chat-file-list"></div>
      <select id="preview-item-select"></select>
      <select id="preview-platform"></select>
      <select id="preview-device"></select>
      <select id="preview-font"></select>
      <input id="preview-font-size" type="range">
      <output id="preview-font-size-value"></output>
      <div id="preview-theme-list"></div>
      <div id="preview-card-settings"></div>
      <div id="preview-layout-settings"></div>
      <span id="connection-feishu-state"></span>
      <div id="connection-feishu"></div>
      <select id="preview-ratio"></select>
      <div id="flow-source-card"></div>
      <select id="flow-guide-next" hidden></select>
      <span id="flow-guide-kicker"></span>
      <strong id="flow-guide-title"></strong>
      <p id="flow-guide-copy"></p>
      <span id="flow-state-mark"></span>
      <h2 id="flow-queue-title"></h2>
      <p id="flow-queue-hint"></p>
      <h1 id="creation-title"></h1>
      <p id="creation-description"></p>
      <div id="chat-welcome"></div>
      <p id="chat-connection-hint"></p>
      <p id="chat-notice"></p>
      <div id="chat-branch-origin"></div>
      <div id="chat-archived-banner"></div>
      <span id="chat-current-title"></span>
      <div id="flow-tabs"></div>
      <div id="workflow-layout"></div>
      <div id="inflow-capture"></div>
      <p id="inflow-input-status"></p>
      <ol id="knowledge-category-list"></ol>
      <div id="knowledge-catalog-list"></div>
      <span id="knowledge-category-path"></span>
      <p id="knowledge-status"></p>
      <div id="collection-bulk-toolbar"></div>
      <span id="collection-selection-summary"></span>
      <span id="queue-summary"></span>
      <div id="selection-bar"></div>
      <div id="work-job-filters"></div>
    </div>

  </body>
</html>
